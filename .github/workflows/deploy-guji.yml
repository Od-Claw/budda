name: Deploy Guji Buddha Hall to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: guji_buddha_hall_3d/package-lock.json

      - name: Install dependencies
        working-directory: guji_buddha_hall_3d
        run: npm ci

      - name: Build Vite project
        working-directory: guji_buddha_hall_3d
        run: npm run build

      - name: Prepare Pages artifact with subfolder path
        run: |
          mkdir -p pages/guji_buddha_hall_3d
          cp -R guji_buddha_hall_3d/dist/* pages/guji_buddha_hall_3d/

      - name: Add optional root redirect
        run: |
          cat > pages/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=/budda/guji_buddha_hall_3d/">
              <title>Redirecting...</title>
            </head>
            <body>
              <a href="/budda/guji_buddha_hall_3d/">前往古蹟佛堂</a>
            </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
